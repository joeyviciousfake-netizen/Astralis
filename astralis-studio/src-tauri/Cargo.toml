[package]
name = "astralis-studio"
version = "0.1.0"
description = "Astralis Studio — Editor de Cartas. Dono: Editor Engineer. Só edita dado de carta; jogo é o Astralis (R1/R4)."
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = { version = "2", features = [] }
tauri-plugin-dialog = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
# .apack V1 (docs/12 §12.7): o .apack é um ZIP comum + SHA256 por arquivo.
# std não tem nenhum dos dois; `zip` (só deflate, sem AES/time extras) e
# `sha2` são o par mínimo para ler/escrever/conferir o formato que o
# tools/apack.py gera. Base64 continua manual (codificar/decodificar já
# existem no backend, sem crate nova).
zip = { version = "2", default-features = false, features = ["deflate"] }
sha2 = "0.10"
